<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Müzik Çalar</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card2: #16213e;
    --accent: #7c3aed;
    --accent2: #a855f7;
    --text: #f1f0ff;
    --text2: #9ca3af;
    --border: rgba(124,58,237,0.2);
    --player-h: 200px;
  }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', sans-serif; }

  #app { display: flex; flex-direction: column; height: 100dvh; }

  /* Header */
  header {
    padding: 14px 16px 10px;
    background: linear-gradient(180deg, #1a1a2e 0%, transparent 100%);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 { font-size: 20px; font-weight: 700; background: linear-gradient(90deg, #a855f7, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .count-badge { font-size: 12px; color: var(--text2); background: var(--card); padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; padding: 0 16px 10px; flex-shrink: 0; }
  .tab { flex: 1; padding: 8px; text-align: center; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: transparent; color: var(--text2); transition: all 0.2s; }
  .tab.active { background: var(--accent); color: white; }

  /* Content area */
  #content { flex: 1; overflow-y: auto; padding: 0 16px; padding-bottom: 8px; }
  #content::-webkit-scrollbar { display: none; }

  /* Upload zone */
  #upload-zone {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 28px 16px;
    text-align: center;
    margin-bottom: 16px;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--card);
  }
  #upload-zone:hover, #upload-zone.drag { border-color: var(--accent2); background: rgba(124,58,237,0.1); }
  #upload-zone .upload-icon { font-size: 36px; margin-bottom: 8px; }
  #upload-zone p { font-size: 14px; color: var(--text2); line-height: 1.5; }
  #upload-zone strong { color: var(--accent2); }
  #file-input { display: none; }

  /* Track list */
  .track-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; border-radius: 12px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
  }
  .track-item:hover { background: var(--card); }
  .track-item.active { background: var(--card); border-color: var(--border); }
  .track-num {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--text2); background: var(--card2);
    flex-shrink: 0; font-weight: 600;
  }
  .track-item.active .track-num { background: var(--accent); color: white; }
  .playing-anim { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
  .playing-anim span { width: 3px; background: white; border-radius: 2px; animation: bounce 0.8s ease-in-out infinite; }
  .playing-anim span:nth-child(2) { animation-delay: 0.1s; }
  .playing-anim span:nth-child(3) { animation-delay: 0.2s; }
  @keyframes bounce { 0%,100% { height: 4px; } 50% { height: 14px; } }
  .track-info { flex: 1; min-width: 0; }
  .track-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-dur { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .track-del { background: none; border: none; color: var(--text2); padding: 8px; cursor: pointer; font-size: 16px; opacity: 0; transition: opacity 0.2s; border-radius: 8px; }
  .track-item:hover .track-del { opacity: 1; }
  .track-del:hover { color: #ef4444; background: rgba(239,68,68,0.1); }

  /* Empty state */
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
  .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* Player */
  #player {
    flex-shrink: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 14px 16px 20px;
  }
  .now-playing { text-align: center; margin-bottom: 12px; }
  .now-playing .song-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-playing .song-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

  /* Seek bar */
  .seek-wrap { position: relative; margin-bottom: 4px; }
  #seek { width: 100%; height: 4px; border-radius: 4px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--pct,0%), #374151 var(--pct,0%));
  }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent2); border: 2px solid white; }
  .time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text2); margin-bottom: 12px; }

  /* Controls */
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .ctrl-btn { background: none; border: none; color: var(--text2); font-size: 22px; cursor: pointer; padding: 8px; border-radius: 50%; transition: all 0.15s; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; }
  .ctrl-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
  .ctrl-btn.active { color: var(--accent2); }
  #play-btn { width: 54px; height: 54px; background: var(--accent); color: white; font-size: 24px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; box-shadow: 0 4px 20px rgba(124,58,237,0.4); }
  #play-btn:hover { transform: scale(1.05); }
  #play-btn:active { transform: scale(0.97); }

  /* Volume */
  .vol-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .vol-icon { font-size: 16px; color: var(--text2); }
  #vol { flex: 1; height: 3px; border-radius: 3px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    background: linear-gradient(to right, var(--accent2) 0%, var(--accent2) var(--vpct,80%), #374151 var(--vpct,80%));
  }
  #vol::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent2); }

  /* Toast */
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1f2937; color: white; padding: 10px 20px; border-radius: 24px; font-size: 13px; z-index: 999; transition: transform 0.3s; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* Install banner */
  #install-banner { background: linear-gradient(135deg, var(--accent), #4f46e5); margin: 0 16px 12px; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  #install-banner p { font-size: 13px; color: white; line-height: 1.4; flex: 1; }
  #install-banner strong { display: block; font-size: 14px; }
  #install-banner .close-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }

  /* Scrollbar helper */
  .track-list { }

  /* Fav star */
  .track-fav { background: none; border: none; color: var(--text2); padding: 6px; cursor: pointer; font-size: 14px; }
  .track-fav.faved { color: #f59e0b; }

  audio { display: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🎵 Müzik Çalar</h1>
    <span class="count-badge" id="count-badge">0 şarkı</span>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="showTab('all')" id="tab-all">Tümü</button>
    <button class="tab" onclick="showTab('fav')" id="tab-fav">⭐ Favoriler</button>
  </div>

  <div id="content">
    <div id="install-banner" style="display:none">
      <p><strong>📲 Uygulamayı Kur!</strong>Telefona ikon olarak ekle</p>
      <button class="close-btn" onclick="closeBanner(event)">✕</button>
    </div>

    <label for="file-input">
      <div id="upload-zone">
        <div class="upload-icon">📂</div>
        <p><strong>Müzik Ekle</strong><br>Dokunarak müzik dosyalarını seç<br><span style="font-size:12px">MP3, WAV, OGG, M4A, FLAC desteklenir</span></p>
      </div>
    </label>
    <input type="file" id="file-input" accept="audio/*" multiple>

    <div class="track-list" id="track-list"></div>
  </div>

  <div id="player">
    <div class="now-playing">
      <div class="song-title" id="song-title">Şarkı seçilmedi</div>
      <div class="song-sub" id="song-sub">Listeden bir şarkı seç</div>
    </div>
    <div class="seek-wrap">
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
    </div>
    <div class="time-row">
      <span id="time-cur">0:00</span>
      <span id="time-total">0:00</span>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="shuffle-btn" onclick="toggleShuffle()" title="Karıştır">🔀</button>
      <button class="ctrl-btn" onclick="prevTrack()" title="Önceki">⏮</button>
      <button id="play-btn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" onclick="nextTrack()" title="Sonraki">⏭</button>
      <button class="ctrl-btn" id="repeat-btn" onclick="toggleRepeat()" title="Tekrar">🔁</button>
    </div>
    <div class="vol-row">
      <span class="vol-icon">🔈</span>
      <input type="range" id="vol" min="0" max="100" value="80">
      <span class="vol-icon">🔊</span>
    </div>
  </div>

  <div id="toast"></div>
</div>

<audio id="audio"></audio>

<script>
const audio = document.getElementById('audio');
let tracks = JSON.parse(localStorage.getItem('tracks_meta') || '[]');
let audioBlobs = {};
let currentIdx = -1;
let isPlaying = false;
let isShuffle = false;
let repeatMode = 0; // 0=off 1=all 2=one
let favTab = false;
let favs = new Set(JSON.parse(localStorage.getItem('favs') || '[]'));

// Load stored blobs from IndexedDB
const dbName = 'MuzikDB', storeName = 'blobs';
let db;
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(dbName, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(storeName);
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = () => rej();
  });
}
function saveBlob(id, blob) {
  return new Promise(res => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(blob, id);
    tx.oncomplete = res;
  });
}
function getBlob(id) {
  return new Promise(res => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get(id);
    req.onsuccess = () => res(req.result);
    req.onerror = () => res(null);
  });
}
function deleteBlob(id) {
  return new Promise(res => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(id);
    tx.oncomplete = res;
  });
}

function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return m + ':' + String(ss).padStart(2,'0');
}

function saveMeta() {
  localStorage.setItem('tracks_meta', JSON.stringify(tracks));
}
function saveFavs() {
  localStorage.setItem('favs', JSON.stringify([...favs]));
}

function renderList() {
  const list = document.getElementById('track-list');
  const visibleTracks = favTab ? tracks.filter(t => favs.has(t.id)) : tracks;
  const cnt = tracks.length;
  document.getElementById('count-badge').textContent = cnt + ' şarkı';

  if (visibleTracks.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="big-icon">${favTab ? '⭐' : '🎵'}</div><p>${favTab ? 'Henüz favori eklenmedi.<br>Şarkılara ⭐ ekle.' : 'Henüz müzik eklenmedi.<br>Yukarıdan müzik dosyaları ekle.'}</p></div>`;
    return;
  }

  list.innerHTML = visibleTracks.map((t, i) => {
    const realIdx = tracks.indexOf(t);
    const isActive = realIdx === currentIdx;
    const isFav = favs.has(t.id);
    return `<div class="track-item ${isActive ? 'active' : ''}" onclick="playTrack(${realIdx})">
      <div class="track-num">${isActive && isPlaying
        ? `<div class="playing-anim"><span></span><span></span><span></span></div>`
        : (realIdx + 1)}</div>
      <div class="track-info">
        <div class="track-name">${t.name}</div>
        <div class="track-dur">${t.duration || '...'}</div>
      </div>
      <button class="track-fav ${isFav ? 'faved' : ''}" onclick="toggleFav(event,${realIdx})">⭐</button>
      <button class="track-del" onclick="deleteTrack(event,${realIdx})">🗑</button>
    </div>`;
  }).join('');
}

function showTab(tab) {
  favTab = tab === 'fav';
  document.getElementById('tab-all').classList.toggle('active', !favTab);
  document.getElementById('tab-fav').classList.toggle('active', favTab);
  renderList();
}

function toggleFav(e, idx) {
  e.stopPropagation();
  const id = tracks[idx].id;
  if (favs.has(id)) favs.delete(id);
  else favs.add(id);
  saveFavs();
  renderList();
}

async function deleteTrack(e, idx) {
  e.stopPropagation();
  const t = tracks[idx];
  await deleteBlob(t.id);
  tracks.splice(idx, 1);
  if (currentIdx === idx) {
    audio.pause();
    isPlaying = false;
    currentIdx = -1;
    updatePlayerUI(null);
  } else if (currentIdx > idx) {
    currentIdx--;
  }
  saveMeta();
  renderList();
  showToast('Şarkı silindi');
}

document.getElementById('file-input').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  showToast(`${files.length} şarkı yükleniyor...`);
  for (const file of files) {
    const id = 'track_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const name = file.name.replace(/\.[^/.]+$/, '');
    await saveBlob(id, file);
    const meta = { id, name, size: file.size, type: file.type };
    tracks.push(meta);
    // get duration
    const url = URL.createObjectURL(file);
    const tmp = new Audio(url);
    tmp.addEventListener('loadedmetadata', () => {
      meta.duration = fmtTime(tmp.duration);
      URL.revokeObjectURL(url);
      saveMeta();
      renderList();
    });
  }
  saveMeta();
  renderList();
  e.target.value = '';
  showToast(`${files.length} şarkı eklendi ✓`);
});

// Drag & drop
const zone = document.getElementById('upload-zone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
zone.addEventListener('drop', e => {
  e.preventDefault(); zone.classList.remove('drag');
  const dt = e.dataTransfer;
  if (dt.files.length) document.getElementById('file-input').files = dt.files;
});

async function playTrack(idx) {
  if (idx < 0 || idx >= tracks.length) return;
  currentIdx = idx;
  const t = tracks[idx];
  let blob = audioBlobs[t.id];
  if (!blob) {
    blob = await getBlob(t.id);
    if (!blob) { showToast('Şarkı bulunamadı!'); return; }
    audioBlobs[t.id] = blob;
  }
  const url = URL.createObjectURL(blob);
  audio.src = url;
  audio.play();
  isPlaying = true;
  updatePlayerUI(t);
  renderList();
}

function updatePlayerUI(t) {
  document.getElementById('song-title').textContent = t ? t.name : 'Şarkı seçilmedi';
  document.getElementById('song-sub').textContent = t ? (t.duration || '') : 'Listeden bir şarkı seç';
  document.getElementById('play-btn').textContent = isPlaying ? '⏸' : '▶';
}

function togglePlay() {
  if (currentIdx < 0) {
    if (tracks.length) playTrack(0);
    return;
  }
  if (isPlaying) { audio.pause(); isPlaying = false; }
  else { audio.play(); isPlaying = true; }
  document.getElementById('play-btn').textContent = isPlaying ? '⏸' : '▶';
  renderList();
}

function prevTrack() {
  if (!tracks.length) return;
  const idx = currentIdx <= 0 ? tracks.length - 1 : currentIdx - 1;
  playTrack(idx);
}

function nextTrack() {
  if (!tracks.length) return;
  let idx;
  if (isShuffle) {
    idx = Math.floor(Math.random() * tracks.length);
  } else {
    idx = (currentIdx + 1) % tracks.length;
  }
  playTrack(idx);
}

function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById('shuffle-btn').classList.toggle('active', isShuffle);
  showToast(isShuffle ? 'Karıştırma açık' : 'Karıştırma kapalı');
}

const repeatIcons = ['🔁', '🔂', '🔂'];
function toggleRepeat() {
  repeatMode = (repeatMode + 1) % 3;
  const btn = document.getElementById('repeat-btn');
  btn.textContent = repeatIcons[repeatMode];
  btn.classList.toggle('active', repeatMode > 0);
  const msgs = ['Tekrar kapalı', 'Tümünü tekrar et', 'Şarkıyı tekrar et'];
  showToast(msgs[repeatMode]);
}

audio.addEventListener('ended', () => {
  if (repeatMode === 2) { audio.currentTime = 0; audio.play(); return; }
  if (repeatMode === 1 || currentIdx < tracks.length - 1 || isShuffle) nextTrack();
  else { isPlaying = false; renderList(); updatePlayerUI(tracks[currentIdx]); }
});

audio.addEventListener('timeupdate', () => {
  const pct = audio.duration ? (audio.currentTime / audio.duration * 100) : 0;
  const seek = document.getElementById('seek');
  seek.value = pct;
  seek.style.setProperty('--pct', pct + '%');
  document.getElementById('time-cur').textContent = fmtTime(audio.currentTime);
  document.getElementById('time-total').textContent = fmtTime(audio.duration);
});

document.getElementById('seek').addEventListener('input', e => {
  if (audio.duration) audio.currentTime = audio.duration * e.target.value / 100;
});

const vol = document.getElementById('vol');
vol.addEventListener('input', e => {
  audio.volume = e.target.value / 100;
  vol.style.setProperty('--vpct', e.target.value + '%');
});
vol.style.setProperty('--vpct', '80%');
audio.volume = 0.8;

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); nextTrack(); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); prevTrack(); }
});

// Media session API
function updateMediaSession(t) {
  if (!navigator.mediaSession) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t ? t.name : 'Müzik Çalar',
    artist: 'Müzik Çalar',
    album: 'Kütüphane'
  });
  navigator.mediaSession.setActionHandler('play', () => { audio.play(); isPlaying = true; updatePlayerUI(t); renderList(); });
  navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); isPlaying = false; updatePlayerUI(t); renderList(); });
  navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
  navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
}

audio.addEventListener('play', () => {
  if (currentIdx >= 0) updateMediaSession(tracks[currentIdx]);
});

// PWA Install
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').style.display = 'flex';
});
document.getElementById('install-banner').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') showToast('Uygulama yüklendi! ✓');
    deferredPrompt = null;
  }
  document.getElementById('install-banner').style.display = 'none';
});
function closeBanner(e) {
  e.stopPropagation();
  document.getElementById('install-banner').style.display = 'none';
}

// Toast
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// PWA manifest (inline)
const manifest = {
  name: 'Müzik Çalar',
  short_name: 'Müzik',
  description: 'Kişisel müzik çalar uygulaması',
  start_url: '.',
  display: 'standalone',
  background_color: '#0f0f1a',
  theme_color: '#1a1a2e',
  orientation: 'portrait',
  icons: [
    { src: "icon-192x192.png", sizes: "192x192", type: "image/png", purpose: "any maskable" },
    { src: "icon-512x512.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }
  ]
};
const blob2 = new Blob([JSON.stringify(manifest)], {type:'application/json'});
const murl = URL.createObjectURL(blob2);


// Init
openDB().then(() => renderList());
</script>

<!-- Service Worker for offline -->
<script>
if ('serviceWorker' in navigator) {
  const swCode = `
const CACHE = 'muzik-v1';
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll([])));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(clients.claim());
});
self.addEventListener('fetch', e => {
  e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
});
  `;
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  const swURL = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swURL).catch(() => {});
}
</script>
</body>
</html>
